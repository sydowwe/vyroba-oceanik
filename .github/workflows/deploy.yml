name: Build & Deploy (EasyPanel)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: node --check server/server.js

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger EasyPanel deploy
        env:
          EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_WEBHOOK" ]; then
            echo "::error::Secret EASYPANEL_DEPLOY_WEBHOOK nie je nastavený (EasyPanel → app → Deployments → Deploy Webhook)."
            exit 1
          fi
          curl -fsS -X POST --retry 4 --retry-delay 5 "$EASYPANEL_DEPLOY_WEBHOOK"

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL premenná nie je nastavená, preskakujem health check."; exit 0; fi
          # čakáme, kým beží nová verzia (healthz vracia SHA commitu z image)
          for i in $(seq 1 36); do
            body=$(curl -fsS "${APP_URL%/}/healthz" || true)
            echo "$body"
            if echo "$body" | grep -q "$GITHUB_SHA"; then echo "Nasadená verzia $GITHUB_SHA beží."; exit 0; fi
            sleep 10
          done
          echo "::error::Nová verzia sa na ${APP_URL%/} neobjavila do 6 minút."
          exit 1
